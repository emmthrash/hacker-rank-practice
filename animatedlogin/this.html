<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yooooo</title>
    <link rel="stylesheet" href="stuff.css">
</head>
<body>
    
    <header>
        <h2 class="logo">logo</h2>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <button class="btnlogin">login</button>
        </nav>
    </header>

    <div class="wrapper">

        <div class="login-formbox login">
            <h2>login</h2>
            <form action="#">
                <div class="inputbox">
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="inputbox">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <div class="remmember-forgot">
                    <label><input type="checkbox">remember me</label>
                    <a href="#">forgot password</a>
                </div>
                <button type="submit" class="btn">login</button>
                <div class="login-register">
                    <p>Do not have an account ?<a href="#" class="register-link">Register</a></p>
                </div>

            </form>
        </div>

        <div class="registration-formbox register">
            <h2>signup</h2>
            <form action="#">
                <div class="inputbox">
                    <input type="text" required>
                    <label>username</label>
                </div>
                <div class="inputbox">
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="inputbox">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <div class="remmember-forgot">
                    <label><input type="checkbox">Agree to terms & conditions</label>
                </div>
                <button type="submit" class="btn">register</button>
                <div class="login-register">
                    <p>Already have an account ?<a href="#" class="login-link">Signin</a></p>
                </div>

            </form>
        </div>

    </div>

    <script src="script.js"></script>
    

</body>
</html>
